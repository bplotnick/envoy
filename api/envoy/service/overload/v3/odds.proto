syntax = "proto3";

package envoy.service.overload.v3;

import "envoy/service/discovery/v3/discovery.proto";

import "google/api/annotations.proto";

import "envoy/annotations/resource.proto";
import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.service.overload.v3";
option java_outer_classname = "OddsProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/service/overload/v3;overloadv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Overload discovery service (ODDS)]

// Discovery service for overload manager configuration.
service OverloadDiscoveryService {
  option (envoy.annotations.resource).type = "envoy.config.overload.v3.OverloadManager";

  rpc StreamOverload(stream discovery.v3.DiscoveryRequest)
      returns (stream discovery.v3.DiscoveryResponse) {
  }

  rpc DeltaOverload(stream discovery.v3.DeltaDiscoveryRequest)
      returns (stream discovery.v3.DeltaDiscoveryResponse) {
  }

  rpc FetchOverload(discovery.v3.DiscoveryRequest) returns (discovery.v3.DiscoveryResponse) {
    option (google.api.http).post = "/v3/discovery:overload";
    option (google.api.http).body = "*";
  }
}

// [#not-implemented-hide:] Workaround for protobuf service linking.
message OddsDummy {
}
